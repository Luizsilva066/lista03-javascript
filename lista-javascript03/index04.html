<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista03</title>
</head>

<body>
    <h1>EXERCICIO 01</h1>
    <script>
        let i = 1;
        let soma = 0;

        while (i <= 5) {
            let num = Number(prompt("Digite o " + i + "º número:"));
            soma += num;
            i++;
        }

        alert("A média é: " + (soma / 5));
    </script>
</body>

</html>
