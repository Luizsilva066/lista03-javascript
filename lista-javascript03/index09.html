<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista03</title>
</head>

<body>
    <h1>EXERCICIO 01</h1>
    <script>
        let i = 1;
        let soma = 0;

        while (i <= 5) {
            let nome = prompt("Digite o nome da pessoa " + i + ":");
            let idade = Number(prompt("Digite a idade de " + nome + ":"));
            soma += idade;
            i++;
        }

        alert("A média das idades é: " + (soma / 5));
    </script>
</body>

</html>
