<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista03</title>
</head>

<body>
    <h1>EXERCICIO 06</h1>
    <script>
        let n = Number(prompt("Digite um número inteiro positivo:"));
        let i = 1;

        while (i <= n) {
            if (n % i === 0) {
                alert(i);
            }
            i++;
        }
    </script>
</body>

</html>
