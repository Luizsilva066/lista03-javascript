<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista03</title>
</head>

<body>
    <h1>EXERCICIO 01</h1>
    <script>
        let n = Number(prompt("Digite um número:"));
        let i = 1;

        while (i <= 10) {
            alert(n + " x " + i + " = " + (n * i));
            i++;
        }
    </script>
</body>

</html>
