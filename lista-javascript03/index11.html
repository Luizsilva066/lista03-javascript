<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista03</title>
</head>

<body>
    <h1>EXERCICIO 01</h1>
    <script>
        let n = Number(prompt("Digite um número:"));
        let i = 1;
        let soma = 0;

        while (i <= n) {
            if (i % 2 === 0) {
                soma += i;
            }
            i++;
        }

        alert("A soma dos pares é: " + soma);
    </script>
</body>

</html>
