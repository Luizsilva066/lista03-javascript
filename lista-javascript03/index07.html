<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista03</title>
</head>

<body>
    <h1>EXERCICIO 07</h1>
    <script>
        let n = Number(prompt("Digite um número:"));
        let i = 1;
        let divisores = 0;

        while (i <= n) {
            if (n % i === 0) {
                divisores++;
            }
            i++;
        }

        if (divisores === 2) {
            alert("É primo");
        } else {
            alert("Não é primo");
        }
    </script>
</body>

</html>
