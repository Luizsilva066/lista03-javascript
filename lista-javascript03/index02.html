<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista03</title>
</head>

<body>
    <script>
        let i = 1;
        let soma = 0;

        while (i <= 100) {
            soma += i;
            i++;
        }

        alert("A soma de 1 a 100 é: " + soma);
    </script>
</body>

</html>
