<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista03</title>
</head>

<body>
    <h1>EXERCICIO 01</h1>
    <script>
        let nome = "";
        let soma = 0;
        let contador = 0;

        while (true) {
            nome = prompt("Digite um nome (ou 'fim' para encerrar):");

            if (nome.toLowerCase() === "fim") {
                break;
            }

            let idade = Number(prompt("Digite a idade de " + nome + ":"));
            soma += idade;
            contador++;
        }

        if (contador > 0) {
            alert("A média das idades é: " + (soma / contador));
        } else {
            alert("Nenhuma pessoa registrada.");
        }
    </script>
</body>

</html>
