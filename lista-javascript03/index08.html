<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista03</title>
</head>

<body>
    <h1>EXERCICIO 01</h1>
    <script>
        let limite = Number(prompt("Digite um número:"));
        let a = 0;
        let b = 1;

        alert(a);
        while (b <= limite) {
            alert(b);
            let temp = a + b;
            a = b;
            b = temp;
        }
    </script>
</body>

</html>
