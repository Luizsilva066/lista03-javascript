<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista03</title>
</head>

<body>
    <h1>EXERCICIO 01</h1>
    <script>
        let n = Number(prompt("Digite um número:"));
        let fatorial = 1;
        let i = n;

        while (i > 1) {
            fatorial *= i;
            i--;
        }

        alert("Fatorial de " + n + " = " + fatorial);
    </script>
</body>

</html>
