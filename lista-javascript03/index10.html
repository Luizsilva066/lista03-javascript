<body>
    <h1>EXERCICIO 01</h1>
    <script>
        let a = 0;
        let b = 1;
        let i = 1;

        alert(a);
        alert(b);

        while (i <= 18) {
            let temp = a + b;
            alert(temp);
            a = b;
            b = temp;
            i++;
        }
    </script>
</body>
